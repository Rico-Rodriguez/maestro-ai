name: Build unsigned iOS IPA

on:
  push:
    branches:
      - cursor/ios-unsigned-ipa-6c0a
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the iOS web bundle
        run: |
          set -euo pipefail
          npm run build:ios
          find dist/assets -name '*.js' -print0 | while IFS= read -r -d '' js; do
            if grep -q 'MASTER TRANSPORT' "$js"; then
              echo "iOS bundle is not minified: $js" >&2
              exit 1
            fi
          done

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        env:
          CAPACITOR_TELEMETRY: 'off'

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install

      - name: Archive without signing
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/MaestroAI.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package MaestroAI.ipa
        run: |
          set -euo pipefail
          APP=$(find "$RUNNER_TEMP/MaestroAI.xcarchive/Products/Applications" -maxdepth 1 -type d -name '*.app' | head -n 1)
          test -n "$APP"
          WORK="$RUNNER_TEMP/ipa"
          rm -rf "$WORK"
          mkdir -p "$WORK/Payload"
          cp -R "$APP" "$WORK/Payload/App.app"
          cd "$WORK"
          zip -r -y "$GITHUB_WORKSPACE/MaestroAI.ipa" Payload
          test -f Payload/App.app/Info.plist
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/App.app/Info.plist)
          DISPLAY_NAME=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' Payload/App.app/Info.plist)
          test "$BUNDLE_ID" = "com.rico.maestroai"
          test "$DISPLAY_NAME" = "Maestro AI"
          unzip -l "$GITHUB_WORKSPACE/MaestroAI.ipa" | grep -q 'Payload/App.app/Info.plist'
          unzip -l "$GITHUB_WORKSPACE/MaestroAI.ipa" | grep -q 'Payload/App.app/public/index.html'
          unzip -l "$GITHUB_WORKSPACE/MaestroAI.ipa" | grep -q 'Payload/App.app/public/audio/salamander/C4.mp3'
          unzip -l "$GITHUB_WORKSPACE/MaestroAI.ipa" | grep -q 'Payload/App.app/public/assets/'

      - name: Publish ios-v1 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=$(printf '%s\n' \
            'Unsigned Maestro AI iOS build for SideInstaller, AltStore, or SideStore.' \
            '' \
            'Bundle ID: com.rico.maestroai' \
            'Display name: Maestro AI' \
            '' \
            'The archive is built with CODE_SIGNING_ALLOWED=NO. SideInstaller re-signs it with your Apple ID.')
          if gh release view ios-v1 >/dev/null 2>&1; then
            gh release upload ios-v1 MaestroAI.ipa --clobber
            gh release edit ios-v1 --prerelease --target "$GITHUB_SHA" --title "Maestro AI iOS v1 (unsigned)" --notes "$NOTES"
          else
            gh release create ios-v1 MaestroAI.ipa --prerelease --target "$GITHUB_SHA" --title "Maestro AI iOS v1 (unsigned)" --notes "$NOTES"
          fi
          gh release view ios-v1 --json url,assets --jq '{url: .url, assets: [.assets[].name]}'
